<!DOCTYPE html>
<html>
<head>
  <!-- Import Materialize CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <title>Medical Records</title>
</head>
<body>
  <div class="container">
    <h1 class="teal-text">Rekam Medis JM</h1>
    <p class="flow-text">Search for a patient by ID to view their details and medical history.</p>

    <!-- Search Form -->
    <div class="row">
      <div class="input-field col s6">
        <input id="patientId" type="text" class="validate">
        <label for="patientId">Patient ID</label>
      </div>
      <div class="col s6">
        <button class="waves-effect waves-light btn" onclick="searchPatient()">
          <i class="material-icons left">search</i>Search
        </button>
      </div>
    </div>

    <!-- Patient Details -->
    <div id="patientDetails" class="card-panel" style="display: none;">
      <h4>Patient Details</h4>
      <table class="striped">
        <tbody>
          <tr><th>Name</th><td id="patientName"></td></tr>
          <tr><th>Age</th><td id="patientAge"></td></tr>
          <tr><th>Gender</th><td id="patientGender"></td></tr>
          <tr><th>Contact</th><td id="patientContact"></td></tr>
          <tr><th>Address</th><td id="patientAddress"></td></tr>
        </tbody>
      </table>
    </div>

    <!-- Medical Records -->
    <div id="medicalRecords" class="card-panel" style="display: none;">
      <h4>Medical History</h4>
      <table class="striped">
        <thead>
          <tr>
            <th>Date</th>
            <th>Diagnosis</th>
            <th>Treatment</th>
            <th>Doctor</th>
          </tr>
        </thead>
        <tbody id="recordsTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Import Materialize JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script>
    function searchPatient() {
      const patientId = document.getElementById('patientId').value;
      if (!patientId) {
        alert('Please enter a Patient ID.');
        return;
      }

      // Call the server-side function to get patient data
      google.script.run.withSuccessHandler(function(data) {
        const response = JSON.parse(data);

        if (response.error) {
          alert(response.error);
          return;
        }

        // Display patient details
        document.getElementById('patientName').textContent = response.patient.name;
        document.getElementById('patientAge').textContent = response.patient.age;
        document.getElementById('patientGender').textContent = response.patient.gender;
        document.getElementById('patientContact').textContent = response.patient.contact;
        document.getElementById('patientAddress').textContent = response.patient.address;
        document.getElementById('patientDetails').style.display = 'block';

        // Display medical records
        const recordsTableBody = document.getElementById('recordsTableBody');
        recordsTableBody.innerHTML = ''; // Clear previous records

        response.medicalRecords.forEach(record => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${record.date}</td>
            <td>${record.diagnosis}</td>
            <td>${record.treatment}</td>
            <td>${record.doctor}</td>
          `;
          recordsTableBody.appendChild(row);
        });

        document.getElementById('medicalRecords').style.display = 'block';
      }).getPatientData(patientId);
    }
  </script>
</body>
</html>
